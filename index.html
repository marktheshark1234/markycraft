<!DOCTYPE html>
<html lang="en" style="width:100%;height:100%;background-color:black;">
  <head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="Eaglercraft 1.12 test directory HTML page">
    <meta name="keywords" content="eaglercraft, eaglercraftx, minecraft, 1.12, 1.12.2">
    <title>MarkerCraft - Eaglercraft 1.12</title>
    <meta property="og:locale" content="en-US">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Eaglercraft 1.12.2">
    <meta property="og:description" content="Play Minecraft 1.12 in your browser">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/lax1dude/eaglercraft-launcher@main/classes.js"></script>
    <script type="text/javascript">
      "use strict";
      window.addEventListener("load", function() {
        if(window.location.href.indexOf("file:") === 0) {
          alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
        } else {
          var relayId = Math.floor(Math.random() * 3);
          window.eaglercraftXOpts = {
            demoMode: false,
            container: "game_frame",
            assetsURI: "https://cdn.jsdelivr.net/gh/lax1dude/eaglercraft@main/assets.epk",
            localesURI: "lang/",
            worldsDB: "worlds",
            servers: [
              { addr: "wss://play.eaglercraft.com", name: "Official Server" }
            ]
          };
          if(typeof main === 'function') {
            main();
          } else {
            document.getElementById('game_frame').innerHTML = '<div style="color: white; padding: 20px; font-family: Arial; text-align: center; margin-top: 50px;"><h2>Error: Game failed to load</h2><p>Check your connection and refresh the page.</p></div>';
          }
        }
      });
    </script>
  </head>
  <body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
  </body>
